name: Build CargoEasy Windows installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd cargoeasy-desktop
         npm install

      - name: Build renderer + installer
        run: cd cargoeasy-desktop
         npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CargoEasy-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
